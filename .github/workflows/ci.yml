name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # The crate targets wasm32-wasip2 for WASI 0.3 / Component Model runtime use,
      # but the unit tests in proto, nkey, kv, and client modules are host-compatible
      # (they don't call WASI socket/clock interfaces at runtime). Running them on
      # the native host gives fast feedback on protocol logic, nkey auth, and header
      # handling without needing wasmtime.
      - name: Run unit tests
        run: |
          cargo test --lib --target x86_64-unknown-linux-gnu \
            -- proto nkey kv client

  check:
    name: Check (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with wasm32-wasip2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: cargo check (all features)
        run: cargo check --all-features --target wasm32-wasip2

      - name: cargo check examples (cdylib)
        run: cargo check --examples --all-features --target wasm32-wasip2
